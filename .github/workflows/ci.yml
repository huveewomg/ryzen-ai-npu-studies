name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Unit and CPU inference smoke tests
        run: python -m unittest discover -s tests -v
      - name: Validate benchmark result schema
        run: python tools/validate_results.py

  compile-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q benchmarks evaluation models npu_study tests tools
